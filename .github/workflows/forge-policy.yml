# Server-side policy gate. Local hooks are fast guardrails; the organization ruleset installed by
# setup-rulesets executes this file from the default branch as the remote wall. The job executes no
# pull-request code, receives a read-only token, and needs no repository secrets.
#
# HONEST SCOPE: the human-provenance check here is a strong SIGNAL, not an unforgeable proof — GitHub
# signs commits it makes on a user's behalf (web edits and the Contents/merge APIs) with its web-flow
# key, so a user-scoped token can produce a "verified, non-bot" commit programmatically. The gate that
# actually blocks a merge is the CODEOWNERS review required by setup-rulesets (a second human), which
# is why CODEOWNERS is itself immutable below. Treat a green forge-policy as "no bot-authored change to
# a protected path was detected," not "a human definitely wrote this."
name: forge-policy

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]

permissions:
  contents: read

jobs:
  forge-policy:
    name: forge-policy
    runs-on: ubuntu-latest
    steps:
      - name: Check protected-path provenance
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Enforce Forge policy
        shell: bash
        env:
          FORGE_API_URL: ${{ github.api_url }}
          FORGE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          FORGE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          FORGE_REPOSITORY: ${{ github.repository }}
          FORGE_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import sys
          import urllib.error
          import urllib.request

          BASE = os.environ["FORGE_BASE_SHA"]
          HEAD = os.environ["FORGE_HEAD_SHA"]
          REPOSITORY = os.environ["FORGE_REPOSITORY"]
          API_URL = os.environ["FORGE_API_URL"].rstrip("/")
          TOKEN = os.environ["FORGE_TOKEN"]

          # These two workflows judge the branch. The organization required-workflow rule executes
          # this logic from the default-branch ref, so a branch-local rewrite cannot replace it.
          SELF_JUDGES = {
              ".github/workflows/ci.yml",
              ".github/workflows/forge-policy.yml",
          }

          def git_bytes(*args):
              result = subprocess.run(
                  ["git", *args],
                  check=False,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
              )
              if result.returncode:
                  detail = result.stderr.decode("utf-8", "replace").strip()
                  raise RuntimeError(f"git {' '.join(args)} failed: {detail}")
              return result.stdout

          def nul_paths(*args):
              raw = git_bytes(*args)
              return {
                  value.decode("utf-8", "surrogateescape")
                  for value in raw.split(b"\0")
                  if value
              }

          def immutable(path):
              value = path.casefold()
              if value in {
                  "docs/constitution.md",
                  "state/mode",
                  "state/trust.json",
                  # CODEOWNERS anchors the whole review model (it is the compensating control this
                  # gate leans on) — so it must itself be human-authored, in all three of its locations.
                  "codeowners",
                  ".github/codeowners",
                  "docs/codeowners",
              }:
                  return True
              if value == "tests/contract" or value.startswith("tests/contract/"):
                  return True
              if value == ".claude/hooks" or value.startswith(".claude/hooks/"):
                  return True
              if value == "scripts/git-hooks" or value.startswith("scripts/git-hooks/"):
                  return True
              if value == ".github/workflows" or value.startswith(".github/workflows/"):
                  return True
              if value == "evals/results/attested" or value.startswith(
                  "evals/results/attested/"
              ):
                  return True
              if value == "evals/results" or value.startswith("evals/results/"):
                  return False
              return value == "evals" or value.startswith("evals/")

          def commit_paths(commit):
              parents = git_bytes(
                  "rev-list", "--parents", "-n", "1", commit
              ).decode("ascii").split()[1:]
              if parents:
                  # First-parent comparison attributes merge conflict resolutions to the merge
                  # commit; side-branch commits are also visited by rev-list below.
                  return nul_paths(
                      "diff",
                      "--name-only",
                      "--no-renames",
                      "-z",
                      parents[0],
                      commit,
                  )
              empty_tree = git_bytes(
                  "hash-object", "-t", "tree", "/dev/null"
              ).decode("ascii").strip()
              return nul_paths(
                  "diff",
                  "--name-only",
                  "--no-renames",
                  "-z",
                  empty_tree,
                  commit,
              )

          def bot_like(login):
              value = (login or "").casefold()
              return (
                  not value
                  or value.endswith("[bot]")
                  or value.endswith("-bot")
                  or value.endswith("_bot")
                  or value
                  in {
                      "copilot",
                      "dependabot",
                      "github-actions",
                      "renovate",
                  }
              )

          def github_commit(commit):
              request = urllib.request.Request(
                  f"{API_URL}/repos/{REPOSITORY}/commits/{commit}",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {TOKEN}",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "forge-policy",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      return json.load(response)
              except (urllib.error.URLError, TimeoutError, json.JSONDecodeError) as error:
                  raise RuntimeError(
                      f"GitHub could not resolve commit {commit[:12]}: {error}"
                  ) from error

          def human_identity(commit):
              data = github_commit(commit)
              author = data.get("author")
              committer = data.get("committer")
              payload = data.get("commit")
              verification = (
                  payload.get("verification") if isinstance(payload, dict) else None
              )
              if not isinstance(author, dict) or author.get("type") != "User":
                  return False, "author is not a server-resolved GitHub User"
              if not isinstance(committer, dict) or committer.get("type") != "User":
                  return False, "committer is not a server-resolved GitHub User"
              if bot_like(author.get("login")):
                  return False, f"author @{author.get('login') or 'unknown'} is automation"
              # GitHub's web-flow account is a User committer for browser-authored commits. Other
              # bot-like committers are rejected even when the claimed author is a User.
              if committer.get("login") != "web-flow" and bot_like(committer.get("login")):
                  return (
                      False,
                      f"committer @{committer.get('login') or 'unknown'} is automation",
                  )
              # A commit's author/committer emails are self-asserted Git fields. A verified
              # signature is the server-verifiable binding that prevents another principal from
              # borrowing a human's public email and being misclassified as that GitHub user.
              if (
                  not isinstance(verification, dict)
                  or verification.get("verified") is not True
              ):
                  reason = (
                      verification.get("reason")
                      if isinstance(verification, dict)
                      else "missing"
                  )
                  return False, f"commit signature is not verified ({reason})"
              return (
                  True,
                  f"verified @{author['login']} (committed by @{committer['login']})",
              )

          try:
              merge_base = git_bytes("merge-base", BASE, HEAD).decode("ascii").strip()
              changed = nul_paths(
                  "diff",
                  "--name-only",
                  "--no-renames",
                  "-z",
                  merge_base,
                  HEAD,
              )
              changed_by_case = {path.casefold(): path for path in changed}

              self_changes = sorted(
                  changed_by_case[path.casefold()]
                  for path in SELF_JUDGES
                  if path.casefold() in changed_by_case
              )
              if self_changes:
                  print(
                      "::error::A branch cannot modify the policy/CI workflows that judge it."
                  )
                  for path in self_changes:
                      print(f"  {path}")
                  sys.exit(1)

              protected = {path for path in changed if immutable(path)}
              if not protected:
                  print("forge-policy: PASS (no immutable paths changed)")
                  sys.exit(0)

              commits = (
                  git_bytes(
                      "rev-list",
                      "--reverse",
                      "--topo-order",
                      f"{merge_base}..{HEAD}",
                  )
                  .decode("ascii")
                  .split()
              )
              violations = []
              checked = 0
              for commit in commits:
                  touched = sorted(commit_paths(commit) & protected)
                  if not touched:
                      continue
                  checked += 1
                  is_human, identity = human_identity(commit)
                  if is_human:
                      print(
                          f"forge-policy: human commit {commit[:12]} {identity}: "
                          + ", ".join(touched)
                      )
                  else:
                      violations.append((commit, identity, touched))

              if not checked:
                  raise RuntimeError(
                      "immutable paths changed, but no responsible commits were found"
                  )
              if violations:
                  print(
                      "::error::Every commit that changes an immutable path must be "
                      "signed, authored, and committed by server-resolved human GitHub users."
                  )
                  for commit, reason, paths in violations:
                      print(f"  {commit} — {reason}")
                      for path in paths:
                          print(f"    {path}")
                  sys.exit(1)

              print(
                  f"forge-policy: PASS ({len(protected)} immutable path(s), "
                  f"{checked} human-authored commit(s))"
              )
          except Exception as error:
              print(f"::error::forge-policy failed closed: {error}")
              sys.exit(1)
          PY
